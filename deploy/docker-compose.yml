services:
  backend:
    build:
      context: ../work/sales_ai_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    volumes:
      - sales_ai_data:/app/data
      - sales_ai_uploads:/app/uploads

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ../outputs/sales_ai_frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sales_ai_data:
  sales_ai_uploads:
