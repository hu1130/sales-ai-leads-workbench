name: sales-ai

services:
  mysql:
    container_name: sales-ai-mysql
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - sales_ai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 20s
      timeout: 5s
      retries: 10

  backend:
    container_name: sales-ai-backend
    build:
      context: ../work/sales_ai_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./.env.prod
    volumes:
      - sales_ai_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    container_name: sales-ai-web
    build:
      context: ..
      dockerfile: outputs/sales_ai_frontend_vue/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  sales_ai_mysql:
  sales_ai_uploads:
